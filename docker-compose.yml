version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: voiceguard-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: voiceguard
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Python ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: voiceguard-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_NAME=lab260/AASIST3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Node.js / Express App Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voiceguard-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/voiceguard
      - ML_SERVICE_URL=http://ml-service:8000
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - ALERT_PHONE_NUMBER=${ALERT_PHONE_NUMBER}
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # 4. React Vite Client Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voiceguard-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
